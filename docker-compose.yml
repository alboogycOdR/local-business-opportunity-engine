services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lboe}
      POSTGRES_USER: ${POSTGRES_USER:-lboe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lboe_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - lboe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lboe} -d ${POSTGRES_DB:-lboe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lboe_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lboe_postgres:
  lboe_redis:
