services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lboe}
      POSTGRES_USER: ${POSTGRES_USER:-lboe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lboe_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - lboe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lboe} -d ${POSTGRES_DB:-lboe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lboe_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "lboe_worker.worker"]
    environment:
      LBOE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lboe}:${POSTGRES_PASSWORD:-lboe_dev_only}@postgres:5432/${POSTGRES_DB:-lboe}
      LBOE_REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/apps/worker/src:/app/apps/api/src:/app/packages/domain/src:/app/packages/scoring/src:/app/integrations/maps_scraper/src:/app/integrations/website_auditor/src
      LBOE_AUDIT_ARTIFACT_ROOT: /app/artifacts/audits
      LBOE_WORKER_HEARTBEAT: /tmp/lboe-worker-heartbeat
      LBOE_WORKER_NAME: ${LBOE_WORKER_NAME:-worker-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "lboe_worker.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  lboe_postgres:
  lboe_redis:
