version: opportunity-v1
scale: 100
bands:
  low: [0, 49]
  medium: [50, 69]
  high: [70, 100]
sections:
  addressable_gap:
    max_points: 55
    rules:
      no_usable_website: 20
      technically_weak_website_max: 12
      no_primary_conversion_path: 10
      no_booking_when_expected: 8
      poor_mobile_ux: 5
  commercial_readiness:
    max_points: 20
  reachability:
    max_points: 10
  demo_confidence:
    max_points: 15
holds:
  - compliance_conflict
  - business_closed
notes:
  - Numeric score must remain deterministic.
  - LLMs may explain but may not directly set points.
  - Exact rule formulas are calibrated after the pilot.
