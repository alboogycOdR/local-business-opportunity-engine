name: CI

on:
  push:
  pull_request:

jobs:
  bootstrap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bootstrap test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Validate bootstrap contract
        run: python -m pytest tests/test_bootstrap_contract.py
