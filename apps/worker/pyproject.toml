[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lboe-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  "playwright>=1.50",
  "beautifulsoup4>=4.12",
]

[project.scripts]
lboe-worker = "lboe_worker.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lboe_worker"]
